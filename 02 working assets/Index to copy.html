<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <title>Test css stuff</title>
   
        <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Playfair Display for a refined feminine touch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        roseMauve: '#C89F9C',
                        roseMauveLight: '#EBD8D5',
                        roseMauveDark: '#A67C79',
                        warmSand: '#F9F6F0',
                        charcoalText: '#2D3142',
                        mutedTaupe: '#8D807A',
                        softBlush: '#F3E9E7'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #2D3142;
            background-color: #F9F6F0;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-warmSand text-charcoalText antialiased selection:bg-roseMauveLight selection:text-charcoalText">

    <header class="sticky top-0 z-50 bg-warmSand/90 backdrop-blur-md border-b border-roseMauveLight/50">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" class="font-serif text-2xl font-semibold tracking-wide text-charcoalText hover:text-roseMauveDark transition-colors">
                Kristina Shatley
</body>
</html>
